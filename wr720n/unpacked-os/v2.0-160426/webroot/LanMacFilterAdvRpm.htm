
<script language=javascript>
function doBack(nPage)

function is_spmac(mac_string)
{
if(mac_string == "00-00-00-00-00-00")
{
alert(js_bad_mac="Invalid MAC address, please input another one!");
return false;
}
var ch = "Ff-";
for (var i = 0; i < mac_string.length; i++)
{
c = mac_string.charAt(i);
if(ch.indexOf(c) == -1)
return true;
}
alert(js_bad_mac="Invalid MAC address, please input another one!");
return false;
}
function doSubmit()
{
if(document.forms[0].Mac.value=="")
{
alert(js_input_mac="Please input a correct MAC address!");
var element = document.forms[0].Mac;
if(element)
{
element.focus();
element.select();
}
return false;
}
if(document.forms[0].Mac.value != "")
{
if(!is_macaddr(document.forms[0].Mac.value))
{
var element = document.forms[0].Mac;
if(element)
{
element.focus();
element.select();
}
return false;
}
if(!is_spmac(document.forms[0].Mac.value))
{
var element = document.forms[0].Mac;
if(element)
{
element.focus();
element.select();
}
return false;
}
}
if(document.forms[0].Desc.value != "")
{
if(!is_hostname(document.forms[0].Desc.value, 30))
{
var element = document.forms[0].Desc;
if(element)
{
element.focus();
element.select();
}
return false;
}
}
return true;
}
