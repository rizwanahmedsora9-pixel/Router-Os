
<SCRIPT language="JavaScript"><!-- 
var str_action = "fresh";

window.onbeforeunload = function()
{
	if (typeof event == "undefined")
	{
		return;
	}
	with (event)
	{
		if (clientX > document.body.clientWidth && clientY < 0 || altKey)
		{
			// DO NOTHING
		}
		else			
		{
			if (str_action == "fresh")
			{
				if (window.parent == window)
				{						
					LoadMain();
					return false;
				}	
			}
			else
			{
				// DO NOTHING
			}
		}
	}
}
document.onkeydown = function()
{
	if (typeof event == "undefined")
	{
		alert("Please wait until system reboots...");
		LoadMain();		
	}
	else
	{
		with(event)
		{
			if (event.keyCode == 116 ||
				event.keyCode == 8 ||
				(ctrlKey && event.keyCode == 82) )
				
			{
				event.keyCode = 0;
				event.returnValue =  false;
			}
		}
	}
}

function LoadMain()
{
	if (updateInf[4] == 1)
	{
		if (updateInf[5] != 0)
		{
			parent.location.href = "http://" + updateInf[5] + ":" + updateInf[1];
		}
		else
		{
			parent.location.href = "http://" + updateInf[0] + ":" + updateInf[1];
		}
	}
	else
	{
		parent.location.href = "http://" + updateInf[0] + ":" + updateInf[1];
	}
	
	return true;
}

function doRefresh()
{
	location.href="/userRpm/FirmwareUpdateTemp.htm";
	return true;
}

function doLoad()
{
	if (0 == updateInf[3])
	{
		window.setTimeout("growUp()",timeout);
	}
	else
	{
		var obj = document.getElementById('td1');
		obj.style.width = "100%";
		var per=document.getElementById("percent");
		per.innerHTML="100%";
		str_action = "close";
		var obj=document.getElementById("tag_notice");
		obj.style.display="block";
		var info = document.getElementById("t_info");
		info.innerHTML = "Software Upgrade Successfully!";
		info.style.color = "green";
		per.style.color="green";
		window.setTimeout("LoadMain()", 3000);
	}
}
var timeout = updateInf[2] * 10;
var rate = 0;

function growUp()
{
	var obj = document.getElementById('td1');
	if (rate < 100)
	rate = rate + 1;
	obj.style.width = rate + "%";
	var per=document.getElementById("percent");
	per.innerHTML=rate+"%";
	if(rate > 99)
	{
		str_action = "close";
		doRefresh();
	}
	window.setTimeout("growUp()",timeout);
	return;
}

//--></SCRIPT>
</HEAD>
