
<script language=javascript><!--//
function doBack(nPage)
{
location.href="/userRpm/DomainFilterRpm.htm?Page="+nPage;
}
function is_numcharacter(num_string)
{
var c; var ch = "0123456789";
for (var i = 0; i < num_string.length; i++)
{
c = num_string.charAt(i);
if(ch.indexOf(c) == -1)
return false;
}
return true;
}
function doSubmit()
{
var i;
if (domainFilterAdvPara[7] > 0)
{
var begintime = document.forms[0].begintime;
var endtime = document.forms[0].endtime;
if((begintime.value=="") ||!is_numcharacter(begintime.value) || (begintime.value.length!=4))
{
alert(js_bad_start_time="Bad start time (only 4 numbers), please input another number!");
return false;
}
if((endtime.value=="") ||!is_numcharacter(endtime.value) || (endtime.value.length!=4))
{
alert(js_bad_end_time="Bad end time (only 4 numbers), please input another number!");
return false;
}
}
if(document.forms[0].domain.value != "")
{
if(!is_domain(document.forms[0].domain.value))
{
return false;
}
}
return true;
}
