</SCRIPT>
<SCRIPT type="text/javascript">
<!-- 
var g_wpsStatus = wpsInf[0];
var g_wpsPIN = wpsInf[1];
var g_enWlan = wpsInf[2];

function doSubmit()
{
	return true;
}

function doOnClick()
{
    location.href = "/userRpm/WpsCfgRpm.htm?NewDev=value";
}

function onChangeMbssid()
{
	location.href="/userRpm/WpsCfgRpm.htm?vapIdx="+document.forms[0].vapIdx.value;
}
//-->
</SCRIPT>
</HEAD>
<BODY onLoad="setTagStr(document,'ntw_wlan_wps');LoadHelp('WlanWpsHelpRpm.htm'); resize(this);" onResize="resize(this);">
<FORM action="WpsCfgRpm.htm" enctype="multipart/form-data" method="get" onSubmit="return doSubmit();">
  <TABLE id="autoWidth"  width="562" border="0" cellspacing="0" cellpadding="0">
    <TR>
	  <TD colspan=2 class="h1" id="t_title">WPS(Wi-Fi Protected SETUP)</TD>
    </TR>
    <TR>
      <TD class="blue" colspan=2>&nbsp;</TD>
    </TR>
    <TR id="line_currentSSID">
    	<TD class="Item" id="t_currentSSID" name="t_currentSSID">Current SSID:</TD>
    	<TD class="emp">
    		<SELECT name="vapIdx" id="vapIdx" onChange="onChangeMbssid();"></SELECT>
    		<SCRIPT  type="text/javascript">
    			for (var i=0, j=0; i < 4; i++)
    			{
					if (ssidList[i] != "")
					{
						document.forms[0].vapIdx.options[j++] = new Option(ssidList[i], i+1, false, false);
					}
    			}
    		</SCRIPT>
    	</TD>
    </TR>
    <TR>
      <TD class="blue" colspan=2>&nbsp;</TD>
    </TR>
    <TR id="enWlan">
		<TD colspan=2>
			<B><FONT color="#FF0000">
				<SPAN id="t_allow">You should turn on wireless first, </SPAN>
				<A href="/userRpm/WlanNetworkRpm.htm" id="t_click_here">Click here </A>
				<SPAN id="t_enb_radio">to Enable Wireless Router Radio.</SPAN>
				</FONT></B>
		</TD>
    </TR>
    <TR id="enWlanBr">
		<TD colspan=2>&nbsp;</TD>
    </TR>
    <TR>
		<TD class="Item" id="t_status">WPS Status:</TD>
		<TD class="emp">
			<SCRIPT type="text/javascript">
				if (g_wpsStatus == 0)
				{
					document.write("<span id=\"t_disabled\">Disabled<\/span>");
				}
				else
				{
					document.write("<span id=\"t_enabled\">Enabled<\/span>");
				}
			</SCRIPT>&nbsp;&nbsp;
			<SCRIPT type="text/javascript">
			document.write('<INPUT name=\"EnWps\"  type=\"submit\" class=\"buttonBig\" value=\"Enable WPS\">');
			document.write('<INPUT name=\"DisWps\" type=\"submit\" class=\"buttonBig\" value=\"Disable WPS\">');
			</SCRIPT>
		</TD>
    </TR>
    <!--<TR><TD class="Item" id="t_pin_set">PIN Settings</TD><TD></TD></TR>-->
    <TR>
		<TD colspan=2>&nbsp;</TD>
    </TR>
    <TR>
		<TD class="Item" height="60" id="t_cur_pin">Current PIN:</TD>
		<TD>
			<SCRIPT type="text/javascript">
				document.write("<B style='font-size: 18px; vertical-align: middle;'>" + g_wpsPIN + "<\/B>");
			</SCRIPT>&nbsp;&nbsp;
			<INPUT name="DefPin" type="submit" class="buttonBig" value="Restore PIN">
			<INPUT name="NewPin" type="submit" class="buttonBig" value="Gen New PIN">
		</TD>
    </TR>
    <TR>
		<TD colspan=2>&nbsp;</TD>
    </TR>
    <TR>
		<TD class="Item" id="t_add_dev">Add a new device:</TD>
		<TD><INPUT name="NewDev" type="button" class="buttonBig" value="Add device" onclick = "doOnClick();"></TD>
    </TR>
    <SCRIPT type="text/javascript">
		if(wpsInf[3] == 1)
		{
			document.write('<TR><TD colspan=2><span style="color:#FF0000" id="t_chng">The change of wireless config will not take effect until the Router reboots, please<\/span><A href="../userRpm/SysRebootRpm.htm" id="t_click_here"> click here <\/A><span id="t_to_reboot" style="color:#FF0000">to reboot.<\/span> <\/TD><\/TR>');  
		}
	</SCRIPT>
    <TR>
		<TD class="blue" colspan=2>&nbsp;</TD>
    </TR>
  </TABLE>
</FORM>
</BODY>
</HTML>
<SCRIPT type="text/javascript">
if (0 == wpsInf[4])
{
	//document.getElementById("line_wlMssid").style.display="none";
	document.forms[0].vapIdx.value=1;
}
else
{
	document.forms[0].vapIdx.value=wpsInf[4];
}

if (g_wpsStatus == 0)
{
	document.forms[0].DisWps.style.display = "none";
	document.forms[0].NewDev.disabled = true;
}
else
{
	document.forms[0].EnWps.style.display = "none";
}
if (g_enWlan == 0)
{
	document.forms[0].DisWps.disabled = true;
	document.forms[0].EnWps.disabled = true;
	document.forms[0].DefPin.disabled = true;
	document.forms[0].NewPin.disabled = true;
	document.forms[0].NewDev.disabled = true;
}
else
{
	document.getElementById("enWlan").style.display = "none";
	document.getElementById("enWlanBr").style.display = "none";
}
</SCRIPT>
