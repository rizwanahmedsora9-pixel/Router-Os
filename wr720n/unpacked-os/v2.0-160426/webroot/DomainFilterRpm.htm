
<script language=javascript><!--//
function doAll(val)
{
if(val=="DelAll")
{
if(domainFilterList.length < 5)
{
alert(js_no_entry="No entry exists in the table!");
return;
}
if(!confirm(js_mksure_delete="Are you sure to delete all entries?"))
return;
}
location.href="/userRpm/DomainFilterRpm.htm?doAll="+val+"&Page="+curPage;
}
function doAdd(nPage)
{
location.href="/userRpm/DomainFilterRpm.htm?Add=Add&Page="+nPage;
}
function doPage(nPage)
{
location.href="DomainFilterRpm.htm?Page="+nPage;
}
function ResetStatus(strInfo)
{
window.status=strInfo;
return true;
}
//--></script></head>

<script language="JavaScript">
if (domainFilterPara[4] > 0)	{
var row = 0;

{

{

}

document.write('<td class=ListC2>'

<script language="JavaScript">
var curPage = domainFilterPara[2];
