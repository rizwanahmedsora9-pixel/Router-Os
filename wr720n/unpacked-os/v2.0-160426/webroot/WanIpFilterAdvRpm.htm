
<script language=javascript><!--//
function doBack(nPage)
{
location.href="/userRpm/WanIpFilterRpm.htm?Page="+nPage;
}
function is_portcharacter(port_string)
{
var c;
var ch = "0123456789";
for (var i = 0; i < port_string.length; i++)
{
c = port_string.charAt(i);
if (ch.indexOf(c) == -1)
return false;
}
return true;
}
function doSubmit()
{
var begintime = document.forms[0].StartTime;
var endtime = document.forms[0].EndTime;
if((begintime.value=="") ||!is_portcharacter(begintime.value) || (begintime.value.length!=4))
{
alert(js_bad_start_time="Bad start time (only 4 numbers), please input another number!");
return false;
}
if((endtime.value=="") ||!is_portcharacter(endtime.value) || (endtime.value.length!=4))
{
alert(js_bad_end_time="Bad end time (only 4 numbers), please input another number!");
return false;
}
if(document.forms[0].InIp1.value!="")
{
if(!ipverify(document.forms[0].InIp1.value))
{
alert(js_bad_lan_ip1="Bad start LAN IP Address, please input another IP Address!");
return false;
}
}
if(document.forms[0].InIp2.value!="")
{
if(!ipverify(document.forms[0].InIp2.value))
{
alert(js_bad_lan_ip2="Bad end LAN IP Address, please input another IP Address!");
return false;
}
}
if(document.forms[0].InPort1.value!="")
{
if(!is_portcharacter(document.forms[0].InPort1.value))
{
alert(js_bad_lan_port1="Bad start LAN port number!");
return false;
}
}
if(document.forms[0].InPort2.value!="")
{
if(!is_portcharacter(document.forms[0].InPort2.value))
{
alert(js_bad_lan_port2="Bad end LAN port number!");
return false;
}
}
if(document.forms[0].ExIp1.value!="")
{
if(!ipverify(document.forms[0].ExIp1.value))
{
alert(js_bad_wan_ip1="Bad start WAN IP Address, please input another IP Address!");
return false;
}
}
if(document.forms[0].ExIp2.value!="")
{
if(!ipverify(document.forms[0].ExIp2.value))
{
alert(js_bad_wan_ip2="Bad end WAN IP Address, please input another IP Address!");
return false;
}
}
if(document.forms[0].ExPort1.value!="")
{
if(!is_portcharacter(document.forms[0].ExPort1.value))
{
alert(js_bad_wan_port1="Bad start WAN port number!");
return false;
}
}
if(document.forms[0].ExPort2.value!="")
{
if(!is_portcharacter(document.forms[0].ExPort2.value))
{
alert(js_bad_wan_port2="Bad end WAN port number!");
return false;
}
}
return true;
}//--></script></head>
