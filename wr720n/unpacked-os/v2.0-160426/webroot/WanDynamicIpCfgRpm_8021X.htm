
<script language="JavaScript"><!--
var wanType = new Array(
"<option id=\"t_dyna\">Dynamic IP</option>",  
"<option id=\"t_stat\">Static IP</option>",  
"<option id=\"t_pppoe\">PPPoE</option>", 
"<option id=\"t_802dy\">802.1X + Dynamic IP</option>",  
"<option id=\"t_802st\">802.1X + Static IP</option>", 
"<option id=\"t_bpa\">BigPond Cable</option>",
"<option id=\"t_l2tp\">L2TP/Russia L2TP</option>",  
"<option id=\"t_pptp\">PPTP/Russia PPTP</option>", 
"<option id=\"t_dualaccess\">Dual Access/Russia PPPoE</option>",		
"<option id=\"t_dhpcplus\">DHCP+</option>",	
""	
);
function doSubmit()
{
var val; val=document.forms[0].mtu.value;
if(val<576||val>1500||val=="")
{
alert(js_bad_mtu="Bad MTU, please input another number!(576 ~ 1500, the default is 1500)");
return false;
}
if(document.forms[0].manual.checked)
{
if(!is_dnsaddr(document.forms[0].dnsserver.value))
{
var element =document.forms[0].dnsserver;
if(element)
{
element.focus();
element.select();
}
return false;
}
if(document.forms[0].dnsserver2.value != "")
{
if(!is_dnsaddr(document.forms[0].dnsserver2.value))
{
var element =document.forms[0].dnsserver2;
if(element)
{
element.focus();
element.select();
}
return false;
}
}
}
return true;
}
function doSet()
{
if(document.forms[0].manual.checked)
{
document.forms[0].dnsserver.disabled = false;
document.forms[0].dnsserver2.disabled = false;
}
else
{
document.forms[0].dnsserver.disabled = true;
document.forms[0].dnsserver2.disabled = true;
}
return true;
}
function doChange()
{
var n = 0;
if(dhcpInf[0] > 1)
{
n = document.forms[0].wan.value;
}
s = "wan="+n;
var t = document.forms[0].wantype.selectedIndex;
location.href = "/userRpm/"+wantypeinfo[t*2+2]+"?"+s;
}
function doLoad()
{
if(document.forms[0].manual.checked)
{
document.forms[0].dnsserver.disabled = false;
document.forms[0].dnsserver2.disabled = false;
}
else
{
document.forms[0].dnsserver.disabled = true;
document.forms[0].dnsserver2.disabled = true;
}
}
var stopRefresh=0;
function doFocus()
{stopRefresh=1; return true;}
function LoadPage()
{
if(1==stopRefresh) {return;}
if(dhcpInf[2])
{
if(dhcpInf[7]==3)
{
if(dhcpInf[3])
{
if(dhcpInf[5])
window.location.href="/userRpm/WanDynamicIpCfgRpm_8021X.htm?IeeeReqFlag=2";
else
window.location.href="/userRpm/WanDynamicIpCfgRpm_8021X.htm?IeeeReqFlag=0";
}
}
else
{
if(dhcpInf[4])
{
window.location.href="/userRpm/WanDynamicIpCfgRpm_8021X.htm";
}
}
}
}
if(dhcpInf[2])
{
if(dhcpInf[7]==3)
{
if(dhcpInf[3])
{
window.setTimeout("LoadPage()",4000);
}
}
else
{
if(dhcpInf[4])
{
window.setTimeout("LoadPage()",5000);
}
}
}
--></script>
