
<script language=javascript><!--//
function doSubmit(){
if(document.forms[0].filename.value == "")
{
alert(js_input_file="Please choose a file to upgrade!");
return false;
}
var tmp = document.forms[0].filename.value;
var filename=/\.bin$/;
if(!filename.test(tmp))
{
	alert(js_choose_file="Please choose a correct file to upgrade!");
	return false;
}
filename =/[^\\]*\.bin/;
var arr=filename.exec(tmp);
if(arr[0].length >= 64)
{
alert(js_bad_file="The filename should not be longer than 64!");
return false;
}
/*
 if(false == GetFileSize())
 {
       return false;
 }
*/
if(!confirm(js_mksure_upgrade="Are you sure to upgrade the firmware?"))
{
return false;
}
return true;
}

document.getElementById("fversion").innerHTML = softUpInf[0];
document.getElementById("hversion").innerHTML = softUpInf[1];
if (0 == softUpInf[2])
{
	document.forms[0].filename.disabled = true;
	document.forms[0].Upgrade.disabled = true;
	document.getElementById("wan_deny").style.display = "";	
}
else

	document.forms[0].filename.disabled = false;
