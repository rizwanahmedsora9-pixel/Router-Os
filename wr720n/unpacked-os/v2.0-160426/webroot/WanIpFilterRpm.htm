
<script language=javascript><!--//
function doAll(val)
{
if(val=="DelAll")
{
if(!confirm(str_pages.ntw_wan_ip_filter.js_mksure_delete))
return;
}
location.href="/userRpm/WanIpFilterRpm.htm?doAll="+val+"&Page="+curPage;
}
function doAdd(nPage)
{
location.href="/userRpm/WanIpFilterRpm.htm?Add=Add&Page="+nPage;
}
function doPage(nPage)
{
location.href="/userRpm/WanIpFilterRpm.htm?Page="+nPage;
}
function ResetStatus(strInfo)
{
window.status="";return true;
}
function doSubmit()
{
var entryTotal = (ipfList.length-2)/8;
var n =0;
var info;
if((!is_number(document.forms[0].SrcIndex.value))||(!is_number(document.forms[0].DestIndex.value)))
{
return false;
}
if(entryTotal == 0)
{
alert(str_pages.ntw_wan_ip_filter.js_no_entry);
return false;
}
if(document.forms[0].SrcIndex.value=="0"||document.forms[0].DestIndex.value=="0")
{
alert(str_pages.ntw_wan_ip_filter.js_bad_id);
return false;
}
if(document.forms[0].DestIndex.value=="")
{
alert(str_pages.ntw_wan_ip_filter.js_input_dest_index);
return false;
}
if(document.forms[0].SrcIndex.value=="")
{
alert(str_pages.ntw_wan_ip_filter.js_input_src_index);
return false;
}
if( (document.forms[0].SrcIndex.value <= entryTotal) && (document.forms[0].DestIndex.value <= entryTotal) )
{
return true;
}
if( document.forms[0].SrcIndex.value == document.forms[0].DestIndex.value )
{
return false;
}
else
{
alert(str_pages.ntw_wan_ip_filter.js_bad_id_index);
return false;
}
}
var procType = new Array(
" ",
"<span id=\"t_all\" name=t_all>ALL<span>",
"TCP",
"UDP"
);
